<!DOCTYPE html>
<html>

<head>
  <script>
    (function () {
      var originalPushState = history.pushState;
      history.pushState = function () {
        // Se algum script externo tentar disparar eventos em frames nulos, 
        // nós protegemos a execução aqui.
        try {
          return originalPushState.apply(this, arguments);
        } catch (e) {
          console.warn("Drahkma: Prevenção de erro no pushState mobile capturada.");
          return;
        }
      };
    })();
  </script>
